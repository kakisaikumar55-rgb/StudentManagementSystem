<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusOne - Marks</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">C</div>
            <div>
                <h2>CampusOne</h2>
                <span>Management System</span>
            </div>
        </div>

        <nav>
            <a href="dashboard.html" class="nav-link"><span>📊</span> Dashboard</a>
            <a href="students.html" class="nav-link"><span>👨‍🎓</span> Students</a>
            <a href="courses.html" class="nav-link"><span>📚</span> Courses</a>
            <a href="departments.html" class="nav-link"><span>🏢</span> Departments</a>
            <a href="marks.html" class="nav-link active"><span>📝</span> Marks</a>
            <a href="attendance.html" class="nav-link"><span>📅</span> Attendance</a>
            <a href="profile.html" class="nav-link"><span>👤</span> Profile</a>
        </nav>

        <div class="sidebar-bottom">
            <a href="index.html" class="nav-link logout"><span>🚪</span> Logout</a>
        </div>

    </aside>


    <main class="main-content">

        <header class="topbar">
            <div>
                <h1>Marks</h1>
                <p>Manage student marks and results</p>
            </div>
        </header>


        <section class="panel">

            <div class="panel-header">

                <div>
                    <h2>Marks Records</h2>
                    <p>Student examination results</p>
                </div>

                <button class="primary-btn" onclick="openMarksForm()">
                    + Add Marks
                </button>

            </div>

            <div class="toolbar">

                <input
                        type="text"
                        id="marksSearch"
                        placeholder="Search by student ID or subject..."
                        onkeyup="searchMarks()">

            </div>

            <div class="table-wrapper">

                <table>

                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Student ID</th>
                        <th>Subject</th>
                        <th>Marks</th>
                        <th>Total</th>
                        <th>Grade</th>
                        <th>Result</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody id="marksTable">
                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>


<div id="marksModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="marksModalTitle">Add Marks</h2>

            <button onclick="closeMarksForm()" class="close-btn">
                &times;
            </button>

        </div>

        <form id="marksForm">

            <input type="hidden" id="marksDbId">

            <div class="form-grid">

                <div class="form-group">
                    <label>Student ID</label>
                    <input type="text" id="marksStudentId" required>
                </div>

                <div class="form-group">
                    <label>Subject</label>
                    <input type="text" id="marksSubject" required>
                </div>

                <div class="form-group">
                    <label>Marks</label>
                    <input type="number" id="marksValue" required>
                </div>

                <div class="form-group">
                    <label>Total Marks</label>
                    <input type="number" id="marksTotal" value="100" required>
                </div>

                <div class="form-group">
                    <label>Grade</label>
                    <select id="marksGrade">
                        <option value="A+">A+</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                        <option value="F">F</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Result</label>
                    <select id="marksResult">
                        <option value="Pass">Pass</option>
                        <option value="Fail">Fail</option>
                    </select>
                </div>

            </div>

            <div class="modal-actions">

                <button type="button"
                        class="secondary-btn"
                        onclick="closeMarksForm()">
                    Cancel
                </button>

                <button type="submit" class="primary-btn">
                    Save Marks
                </button>

            </div>

        </form>

    </div>

</div>

<script src="js/marks.js"></script>

</body>
</html>
