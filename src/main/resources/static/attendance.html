<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusOne - Attendance</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">C</div>
            <div>
                <h2>CampusOne</h2>
                <span>Management System</span>
            </div>
        </div>

        <nav>
            <a href="dashboard.html" class="nav-link"><span>📊</span> Dashboard</a>
            <a href="students.html" class="nav-link"><span>👨‍🎓</span> Students</a>
            <a href="courses.html" class="nav-link"><span>📚</span> Courses</a>
            <a href="departments.html" class="nav-link"><span>🏢</span> Departments</a>
            <a href="marks.html" class="nav-link"><span>📝</span> Marks</a>
            <a href="attendance.html" class="nav-link active"><span>📅</span> Attendance</a>
            <a href="profile.html" class="nav-link"><span>👤</span> Profile</a>
        </nav>

        <div class="sidebar-bottom">
            <a href="index.html" class="nav-link logout"><span>🚪</span> Logout</a>
        </div>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <div>
                <h1>Attendance</h1>
                <p>Manage student attendance</p>
            </div>

        </header>


        <section class="panel">

            <div class="panel-header">

                <div>
                    <h2>Attendance Records</h2>
                    <p>Student attendance information</p>
                </div>

                <button class="primary-btn"
                        onclick="openAttendanceForm()">
                    + Add Attendance
                </button>

            </div>


            <div class="toolbar">

                <input
                        type="text"
                        id="attendanceSearch"
                        placeholder="Search attendance..."
                        onkeyup="searchAttendance()">

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                    <tr>
                        <th>ID</th>
                        <th>Student ID</th>
                        <th>Student Name</th>
                        <th>Subject</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>

                    </thead>

                    <tbody id="attendanceTable">
                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>


<div id="attendanceModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="attendanceModalTitle">
                Add Attendance
            </h2>

            <button onclick="closeAttendanceForm()"
                    class="close-btn">
                &times;
            </button>

        </div>


        <form id="attendanceForm">

            <input type="hidden" id="attendanceDbId">

            <div class="form-grid">

                <div class="form-group">

                    <label>Student ID</label>

                    <input type="text"
                           id="attendanceStudentId"
                           required>

                </div>


                <div class="form-group">

                    <label>Student Name</label>

                    <input type="text"
                           id="attendanceStudentName"
                           required>

                </div>


                <div class="form-group">

                    <label>Subject</label>

                    <input type="text"
                           id="attendanceSubject"
                           required>

                </div>


                <div class="form-group">

                    <label>Date</label>

                    <input type="date"
                           id="attendanceDate"
                           required>

                </div>


                <div class="form-group">

                    <label>Status</label>

                    <select id="attendanceStatus">

                        <option value="Present">
                            Present
                        </option>

                        <option value="Absent">
                            Absent
                        </option>

                    </select>

                </div>

            </div>


            <div class="modal-actions">

                <button type="button"
                        class="secondary-btn"
                        onclick="closeAttendanceForm()">
                    Cancel
                </button>

                <button type="submit"
                        class="primary-btn">
                    Save Attendance
                </button>

            </div>

        </form>

    </div>

</div>

<script src="js/attendance.js"></script>

</body>
</html>
